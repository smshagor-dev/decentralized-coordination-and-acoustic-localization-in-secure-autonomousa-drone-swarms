name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.10", "3.11"]

    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CI dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy cryptography matplotlib python-dateutil python-docx PyQt5 pytest pytest-cov

      - name: Verify Python syntax
        shell: bash
        run: |
          python -m compileall \
            acoustic_tracking.py \
            communication.py \
            drone.py \
            dynamic_obstacles.py \
            flying_ledger.py \
            latency_monitor.py \
            leader_follower_logic.py \
            main.py \
            ml_system.py \
            ml_trainer.py \
            swarm_manager.py \
            test_dynamic_features.py \
            test_ledger_and_acoustic.py \
            tests/gui_smoke_test.py

      - name: Run targeted test suite
        shell: bash
        run: |
          pytest -q \
            --junitxml=pytest-results.xml \
            test_dynamic_features.py \
            test_ledger_and_acoustic.py

      - name: Upload Python test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: warn

  gui-smoke:
    name: GUI smoke test (ubuntu-latest)
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GUI test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy cryptography matplotlib python-dateutil python-docx PyQt5

      - name: Run GUI smoke test
        shell: bash
        run: |
          xvfb-run -a python tests/gui_smoke_test.py

  native:
    name: Native build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: bash
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/native -G "Visual Studio 17 2022" -A x64

      - name: Build native targets
        shell: bash
        if: runner.os != 'Windows'
        run: |
          cmake --build build/native --config Release --target drone_controller

      - name: Build native targets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build build/native --config Release --target drone_controller

      - name: Upload native build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-${{ matrix.os }}
          path: |
            build/native/**/*.dll
            build/native/**/*.lib
            build/native/**/*.exp
            build/native/**/*.so
            build/native/**/*.dylib
            build/native/**/*.a
          if-no-files-found: warn
