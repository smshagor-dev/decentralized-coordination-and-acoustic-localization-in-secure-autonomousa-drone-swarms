name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR checks when the experiment branch receives a new commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.10", "3.11"]

    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen

    steps:
      # Long repository and versioned supplementary paths exceed Git for Windows
      # default path limits. Configure Git before checking out the tree.
      - name: Enable long paths for Windows checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CI dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy cryptography matplotlib python-dateutil python-docx PyQt5 pytest pytest-cov

      - name: Verify Python syntax
        shell: bash
        run: |
          python -m compileall \
            acoustic_tracking.py communication.py drone.py dynamic_obstacles.py \
            flying_ledger.py latency_monitor.py leader_follower_logic.py \
            main.py ml_system.py ml_trainer.py swarm_manager.py \
            swarm_mesh.py swarm_formation.py swarm_transport.py swarm_runtime.py \
            mesh_demo.py mesh_simulation.py swarm_tasks.py swarm_identity_store.py \
            swarm_deployment.py swarm_dashboard.py \
            test_dynamic_features.py test_ledger_and_acoustic.py \
            test_swarm_coordination.py test_swarm_identity_store.py \
            test_mesh_simulation.py test_swarm_deployment.py \
            test_swarm_dashboard.py test_swarm_tasks.py test_swarm_scaling.py \
            acoustic_quality.py acoustic_benchmark.py beacon_localization.py \
            swarm_safety.py quorum_audit.py swarm_model_validation.py \
            test_acoustic_quality.py test_acoustic_benchmark.py \
            test_beacon_localization.py test_ledger_integrity.py \
            test_swarm_safety.py test_quorum_audit.py \
            test_swarm_resilience.py test_swarm_model_validation.py \
            experiment_statistics.py swarm_network_experiments.py \
            swarm_geometry_experiments.py swarm_acoustic_experiments.py \
            swarm_experiment_runner.py experiment_figures.py test_swarm_experiments.py \
            consistency_gated_step2_probe.py test_consistency_gated_step2.py \
            swarm_consistency_gate.py consistency_gated_step3_probe.py \
            test_swarm_consistency_gate.py \
            swarm_telemetry_faults.py swarm_fault_experiment_runner.py \
            test_swarm_telemetry_faults.py \
            swarm_allocation_baselines.py swarm_baseline_comparison.py \
            test_swarm_allocation_baselines.py \
            swarm_task_recovery.py swarm_recovery_experiments.py \
            test_swarm_task_recovery.py test_swarm_recovery_experiments.py \
            swarm_independent_pilot.py test_swarm_independent_pilot.py \
            swarm_robust_witness_gate.py swarm_robust_holdout.py \
            test_swarm_robust_holdout.py \
            research_step9_evidence_audit.py test_research_step9_evidence_audit.py \
            tests/gui_smoke_test.py

      - name: Run full coordination and existing regression suites
        shell: bash
        run: |
          pytest -q \
            --junitxml=pytest-results.xml \
            test_dynamic_features.py \
            test_ledger_and_acoustic.py \
            test_swarm_coordination.py \
            test_mesh_simulation.py \
            test_swarm_tasks.py \
            test_swarm_identity_store.py \
            test_swarm_deployment.py \
            test_swarm_dashboard.py \
            test_swarm_scaling.py \
            test_acoustic_quality.py \
            test_acoustic_benchmark.py \
            test_beacon_localization.py \
            test_quorum_audit.py \
            test_ledger_integrity.py \
            test_swarm_safety.py \
            test_swarm_resilience.py \
            test_swarm_model_validation.py \
            test_swarm_experiments.py \
            test_consistency_gated_step2.py \
            test_swarm_consistency_gate.py \
            test_swarm_telemetry_faults.py \
            test_swarm_allocation_baselines.py \
            test_swarm_task_recovery.py \
            test_swarm_recovery_experiments.py \
            test_swarm_independent_pilot.py \
            test_swarm_robust_holdout.py \
            test_research_step9_evidence_audit.py

      - name: Reproduce signed telemetry assignment baseline incidents
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: |
          python consistency_gated_step2_probe.py \
            --out experiment_outputs/consistency-gated-step2
          python -c "import hashlib,json; from pathlib import Path; p=Path('experiment_outputs/consistency-gated-step2'); a=(p/'incidents.json').read_bytes(); m=json.loads((p/'manifest.json').read_text()); r=json.loads(a); assert hashlib.sha256(a).hexdigest()==m['incidents_json_sha256']; assert len(r)==3 and m['result_rows']==3; assert [x['assignment_disagreement'] for x in r]==[False,True,True]; assert r[2]['actual_assignee_truth_ineligible'] is True; assert m['proposed_method_implemented'] is False"

      - name: Upload signed telemetry Step 2 baseline evidence
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: consistency-gated-step2-baseline-evidence
          path: experiment_outputs/consistency-gated-step2/
          if-no-files-found: error

      - name: Reproduce Step 3 gate diagnostic controls
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: |
          python consistency_gated_step3_probe.py --out experiment_outputs/consistency-gated-step3
          python -c "import hashlib,json; from pathlib import Path; p=Path('experiment_outputs/consistency-gated-step3'); raw=(p/'gate_diagnostics.json').read_bytes(); m=json.loads((p/'manifest.json').read_text()); a=json.loads(raw); assert len(a)==m['rows']==5; assert hashlib.sha256(raw).hexdigest()==m['sha256']; assert a[0]['gate_assignee']==2 and a[1]['gate_assignee']==1; assert a[2]['gate_assignee']==2; assert a[3]['gate_assignee']==1; assert a[4]['gate_assignee'] is None; assert not m['new_paper_comparative_results_established']"

      - name: Upload Step 3 gate diagnostic evidence
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: consistency-gated-step3-diagnostic-evidence
          path: experiment_outputs/consistency-gated-step3/
          if-no-files-found: error

      - name: Run Step 4 signed-telemetry fault injection and verify archive
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: |
          python swarm_fault_experiment_runner.py \
            --sizes 5 10 --trials 2 --seed 2026 \
            --out experiment_outputs/consistency-gated-step4
          python -c "import hashlib,json,csv; from pathlib import Path; p=Path('experiment_outputs/consistency-gated-step4'); m=json.loads((p/'manifest.json').read_text()); rows=json.loads((p/'fault_trials.json').read_text()); assert len(rows)==m['run_count']==52; assert len(m['scenarios'])==13; assert m['full_paper_comparative_evidence_available'] is False; assert m['physical_uav_flight'] is False; assert all(hashlib.sha256((p/name).read_bytes()).hexdigest()==digest for name,digest in m['sha256'].items()); assert len(list(csv.DictReader((p/'fault_trial_metrics.csv').open(newline=''))))==52; assert any(x['scenario']=='malicious_witness' and x['witness_strict']['disagrees_with_offline_oracle'] for x in rows); assert any(x['scenario']=='colluding_witnesses' and x['witness_strict']['truth_ineligible'] for x in rows)"

      - name: Upload Step 4 adversarial diagnostic evidence
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: consistency-gated-step4-fault-evidence
          path: experiment_outputs/consistency-gated-step4/
          if-no-files-found: error

      - name: Reproduce Step 5 equal-information paired allocation baselines
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: |
          python swarm_baseline_comparison.py \
            --sizes 5 10 --trials 2 --seed 2026 \
            --out experiment_outputs/consistency-gated-step5
          python -c "import csv,hashlib,json;from pathlib import Path;p=Path('experiment_outputs/consistency-gated-step5');m=json.loads((p/'manifest.json').read_text());rows=json.loads((p/'paired_baseline_trials.json').read_text());ep=json.loads((p/'signed_episode_snapshots.json').read_text());assert len(ep)==m['source_fault_episodes']==52;assert len(rows)==m['paired_comparator_rows']==624;assert len(m['optimizers'])==4 and len(m['information_cohorts'])==3;assert m['statistical_superiority_established'] is False and m['cbba_static_specialization_not_full_cbba'] is True;assert all(hashlib.sha256((p/n).read_bytes()).hexdigest()==digest for n,digest in m['sha256'].items());assert len(list(csv.DictReader((p/'paired_baseline_metrics.csv').open(newline=''))))==624"

      - name: Upload Step 5 paired baseline comparison evidence
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: consistency-gated-step5-comparison-evidence
          path: experiment_outputs/consistency-gated-step5/
          if-no-files-found: error

      - name: Generate Step 6 versioned task recovery diagnostic evidence
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: |
          python swarm_recovery_experiments.py \
            --sizes 5 10 --trials 2 --seed 2026 \
            --out experiment_outputs/consistency-gated-step6
          python -c "import hashlib,json,csv;from pathlib import Path;p=Path('experiment_outputs/consistency-gated-step6');m=json.loads((p/'manifest.json').read_text());rows=json.loads((p/'recovery_episodes.json').read_text());assert len(rows)==m['episode_rows']==40;assert m['scenario_count']==10;assert m['independent_publication_scale_evidence'] is False;assert m['no_flight_commands_emitted'] is True;assert all(hashlib.sha256((p/name).read_bytes()).hexdigest()==digest for name,digest in m['sha256'].items());assert all(x['local_audit_chain_valid'] for x in rows);assert any(x['scenario']=='false_signed_stop' and x['task_versions_issued']==2 and not x['simulated_truthful_stop_confirmed'] for x in rows);assert any(x['scenario']=='unconfirmed_failure' and x['expired_unconfirmed']==1 for x in rows);assert len(list(csv.DictReader((p/'recovery_metrics.csv').open(newline=''))))==40"

      - name: Upload Step 6 task recovery diagnostics
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: consistency-gated-step6-recovery-evidence
          path: experiment_outputs/consistency-gated-step6/
          if-no-files-found: error

      - name: Upload Python test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: warn

  independent-pilot:
    name: Step 7 independently seeded paired pilot (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install signed observation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pytest

      - name: Verify focused source and statistical tests
        run: |
          pytest -q test_swarm_independent_pilot.py

      - name: Execute frozen 960-episode randomized software pilot
        run: |
          python swarm_independent_pilot.py \
            --sizes 5 10 20 50 --trials 30 --seed 2026 \
            --out experiment_outputs/consistency-gated-step7-pilot

      - name: Check episode unit, complete pairs and archive integrity
        run: |
          python -c "import csv,hashlib,json;from pathlib import Path;p=Path('experiment_outputs/consistency-gated-step7-pilot');m=json.loads((p/'manifest.json').read_text());e=json.loads((p/'randomized_episodes.json').read_text());r=json.loads((p/'paired_methods.json').read_text());s=json.loads((p/'exploratory_stratum_summaries.json').read_text());assert m['source_episode_count']==len(e)==960;assert m['paired_method_rows']==len(r)==5760;assert m['stratum_summary_rows']==len(s)==192;assert len(set((x['n'],x['scenario'],x['seed']) for x in e))==960;assert sorted(set(x['n'] for x in e))==[5,10,20,50];assert len(m['methods'])==6 and all(x['episodes']==30 for x in s);assert not m['confirmatory_holdout_completed'] and not m['publication_scale_superiority_established'];assert all(hashlib.sha256((p/name).read_bytes()).hexdigest()==digest for name,digest in m['sha256'].items());assert len(list(csv.DictReader((p/'paired_method_metrics.csv').open(newline=''))))==5760"

      - name: Upload new independent Step 7 pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consistency-gated-step7-independent-pilot
          path: experiment_outputs/consistency-gated-step7-pilot/
          if-no-files-found: error

  robust-holdout:
    name: Step 8 frozen robust witness dev and heldout study (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install source-level cryptography and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pytest

      - name: Validate adversarial outlier and frozen design contracts
        run: |
          pytest -q test_swarm_robust_holdout.py test_swarm_independent_pilot.py

      - name: Execute frozen Step 8 development simulations
        run: |
          python swarm_robust_holdout.py --sample development \
            --sizes 5 10 20 50 \
            --out experiment_outputs/consistency-gated-step8/development

      - name: Validate development sample before running heldout
        run: |
          python -c "import hashlib,json;from pathlib import Path;p=Path('experiment_outputs/consistency-gated-step8/development');m=json.loads((p/'manifest.json').read_text());r=json.loads((p/'paired_policies.json').read_text());assert m['episodes']==288 and m['paired_rows']==len(r)==1728 and m['summary_rows']==216;assert all(hashlib.sha256((p/name).read_bytes()).hexdigest()==sha for name,sha in m['sha256'].items());assert m['sample_type']=='development' and m['root_seed']==82026;assert not m['scientific_novelty_proven']"

      - name: Execute frozen independent Step 8 heldout simulations
        run: |
          python swarm_robust_holdout.py --sample heldout \
            --sizes 5 10 20 50 \
            --out experiment_outputs/consistency-gated-step8/heldout

      - name: Validate complete heldout pairs and hashes
        run: |
          python -c "import csv,hashlib,json;from pathlib import Path;p=Path('experiment_outputs/consistency-gated-step8/heldout');m=json.loads((p/'manifest.json').read_text());e=json.loads((p/'episodes.json').read_text());r=json.loads((p/'paired_policies.json').read_text());s=json.loads((p/'stratum_summaries.json').read_text());assert len(e)==m['episodes']==720;assert len(r)==m['paired_rows']==4320;assert len(s)==m['summary_rows']==216;assert len(set((x['n'],x['scenario'],x['seed']) for x in e))==720;assert sorted(set(x['n'] for x in e))==[5,10,20,50];assert all(x['episodes']==20 for x in s);assert m['root_seed']==82027 and m['sample_type']=='heldout';assert m['external_preregistration'] is False and m['scientific_novelty_proven'] is False;assert all(hashlib.sha256((p/name).read_bytes()).hexdigest()==sha for name,sha in m['sha256'].items());assert len(list(csv.DictReader((p/'paired_metrics.csv').open(newline=''))))==4320"

      - name: Independent Step 9 audit of both saved source datasets
        run: |
          pytest -q test_research_step9_evidence_audit.py
          python research_step9_evidence_audit.py \
            --development experiment_outputs/consistency-gated-step8/development \
            --heldout experiment_outputs/consistency-gated-step8/heldout \
            --out experiment_outputs/consistency-gated-step9-audit
          python -c "import json,hashlib;from pathlib import Path;p=Path('experiment_outputs/consistency-gated-step9-audit');d=json.loads((p/'scientific_evidence_audit.json').read_text());m=json.loads((p/'audit_manifest.json').read_text());assert d['audit_status']=='PASS' and d['heldout_episodes']==720 and d['heldout_policy_rows']==4320 and d['scientific_readiness']=='NO_GO_FOR_ALGORITHMIC_SUPERIORITY';assert d['synthetic_safety_coverage']['veto_3']['harmful_episodes']==0;assert d['synthetic_safety_coverage']['median_3_motion']['harmful_episodes']==30;assert m['novelty_submission_gate']=='NO_GO';assert all(hashlib.sha256((p/name).read_bytes()).hexdigest()==h for name,h in m['audited_files_sha256'].items())"

      - name: Upload Step 9 independent scientific audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consistency-gated-step9-independent-audit
          path: experiment_outputs/consistency-gated-step9-audit/
          if-no-files-found: error

      - name: Upload Step 8 development and heldout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consistency-gated-step8-robust-holdout
          path: experiment_outputs/consistency-gated-step8/
          if-no-files-found: error

  native:
    name: Native build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release

      - name: Build native targets
        shell: bash
        run: |
          cmake --build build/native --config Release --target drone_controller

      - name: Upload native build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-${{ matrix.os }}
          path: |
            build/native/**/*.dll
            build/native/**/*.lib
            build/native/**/*.exp
            build/native/**/*.so
            build/native/**/*.dylib
            build/native/**/*.a
          if-no-files-found: warn

  experiment-evidence:
    name: Seeded swarm experiment evidence (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy cryptography matplotlib

      - name: Generate observed synthetic experiment evidence
        run: |
          python swarm_experiment_runner.py \
            --sizes 5 10 20 50 \
            --trials 6 \
            --seed 2026 \
            --bootstrap-samples 500 \
            --figures \
            --out experiment_outputs/swarm

      - name: Check evidence schema and sampled sizes
        run: |
          python -c "import json; from pathlib import Path; p=Path('experiment_outputs/swarm'); m=json.loads((p/'manifest.json').read_text()); rows=json.loads((p/'trials.json').read_text()); assert m['sizes']==[5,10,20,50]; assert len(rows)==m['raw_rows'] and len(rows)>300; assert m['real_uav_hardware'] is False; print('Verified observed rows:',len(rows))"

      - name: Upload reproducible raw experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seeded-swarm-experiment-evidence
          path: experiment_outputs/swarm/
          if-no-files-found: warn
